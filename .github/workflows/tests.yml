name: engineering-ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: engineering-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    name: install, lint, format, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install Linux sandbox dependency
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src tests
      - name: Formatting
        run: uv run ruff format --check src tests
      - name: Unit and regression tests
        run: uv run pytest -q
      - name: Build package
        run: uv build
