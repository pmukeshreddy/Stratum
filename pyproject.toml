[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/configs", "/docs", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/threadweave"]

[project]
name = "threadweave"
version = "0.2.0"
description = "Persistent recursive agent sessions with Python working state and daemon-owned execution"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "httpx>=0.27,<1",
    "croniter>=3,<7",
    "prompt-toolkit>=3.0.51,<4",
    "rich>=13.9,<15",
    "ipython>=8.30,<10",
    "mcp>=1.29,<2",
    "pyyaml>=6,<7",
    "watchfiles>=1.1,<2",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-rust>=0.24,<0.25",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
    "tree-sitter-cpp>=0.23,<0.24",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "cloudpickle>=3.1,<4",
    "tiktoken>=0.11,<1",
    "psutil>=7,<8",
    "jedi>=0.20,<0.21",
    "aiohttp>=3.12,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
    "pexpect>=4.9,<5",
    "pytest-timeout>=2.3,<3",
]
semantic = [
    "fastembed>=0.7,<1",
]

[project.scripts]
threadweave = "threadweave.cli:main"
buffalo = "threadweave.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "ASYNC"]
