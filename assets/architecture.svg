<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010" role="img" aria-labelledby="title desc">
  <title id="title">Stratum — Essential Architecture</title>
  <desc id="desc">A human uses the Agents View to interact with a root session. The root and its recursive subagents each retain model context and a persistent IPython REPL, and act through the Environment. A daemon owns session lifecycle, recovery, and message queues. The continual harness stores versioned memories, skills, prompt notes, and subagent specifications. Solid arrows show interaction; dashed arrows show session ownership and persistent state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#111"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #111; font-size: 22px; }
      .heading { font-family: Georgia, 'Times New Roman', serif; font-size: 37px; font-weight: bold; }
      .box { fill: white; stroke: #111; stroke-width: 2.3; }
      .name { font-weight: bold; font-size: 24px; }
      .edge { fill: none; stroke: #111; stroke-width: 2.5; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .state { stroke-dasharray: 8 7; stroke-width: 2; }
      .small { font-size: 20px; }
    </style>
  </defs>
  <rect width="1400" height="1010" fill="white"/>
  <text x="700" y="61" text-anchor="middle" class="heading">Stratum — Essential Architecture</text>

  <text x="26" y="215" class="name">Human</text>
  <path d="M 112 207 H 174" class="edge"/>
  <rect x="180" y="150" width="280" height="114" rx="9" class="box"/>
  <text x="320" y="182" text-anchor="middle" class="name">Agents View / CLI</text>
  <text x="320" y="214" text-anchor="middle">inspect, attach,</text>
  <text x="320" y="243" text-anchor="middle">message, intervene</text>
  <path d="M 466 207 H 574" class="edge both"/>

  <rect x="580" y="140" width="300" height="134" rx="9" class="box"/>
  <text x="730" y="177" text-anchor="middle" class="name">Root Session</text>
  <text x="730" y="214" text-anchor="middle">model context</text>
  <text x="730" y="248" text-anchor="middle">persistent IPython REPL</text>
  <path d="M 886 207 H 1054" class="edge both"/>
  <text x="970" y="163" text-anchor="middle" class="small">actions /</text>
  <text x="970" y="189" text-anchor="middle" class="small">observations</text>

  <rect x="1060" y="140" width="314" height="134" rx="9" class="box"/>
  <text x="1217" y="177" text-anchor="middle" class="name">Environment</text>
  <text x="1217" y="214" text-anchor="middle">files / Git / code / tools</text>
  <text x="1217" y="248" text-anchor="middle">verifiers / external world</text>

  <path d="M 686 280 V 384" class="edge"/>
  <text x="667" y="343" text-anchor="end" font-family="monospace">rlm()</text>
  <path d="M 786 384 V 280" class="edge"/>
  <text x="800" y="343">messages / results</text>
  <rect x="580" y="390" width="300" height="134" rx="9" class="box"/>
  <text x="730" y="426" text-anchor="middle" class="name">Recursive Subagents</text>
  <text x="730" y="464" text-anchor="middle">persistent child sessions</text>
  <text x="730" y="497" text-anchor="middle">own context + own REPL</text>
  <path d="M 886 456 L 1054 282" class="edge both"/>

  <path d="M 438 614 C 438 459 491 371 575 280" class="edge state both"/>
  <path d="M 567 614 C 567 580 533 568 576 530" class="edge state both"/>
  <rect x="290" y="620" width="300" height="150" rx="9" class="box"/>
  <text x="440" y="655" text-anchor="middle" class="name">Daemon</text>
  <text x="440" y="693" text-anchor="middle">owns live sessions</text>
  <text x="440" y="725" text-anchor="middle">lifecycle / recovery</text>
  <text x="440" y="755" text-anchor="middle">scheduling / message queues</text>
  <path d="M 596 695 H 954" class="edge state both"/>
  <text x="775" y="675" text-anchor="middle">persistent, versioned state</text>

  <rect x="960" y="620" width="360" height="150" rx="9" class="box"/>
  <text x="1140" y="655" text-anchor="middle" class="name">Continual Harness</text>
  <text x="1140" y="693" text-anchor="middle">history / memories / skills</text>
  <text x="1140" y="725" text-anchor="middle">prompt notes / refinements</text>
  <text x="1140" y="755" text-anchor="middle">reusable subagent specifications</text>

  <text x="700" y="842" text-anchor="middle"><tspan font-weight="bold">Information state:</tspan>   L1 active context  ↔  L2 persistent REPL</text>
  <text x="700" y="875" text-anchor="middle">↔  L3 disk-backed history, memories, skills, and checkpoints</text>
  <text x="700" y="928" text-anchor="middle"><tspan font-weight="bold">Long-running work:</tspan>   autonomous mode / persistent goals / heartbeats</text>
  <text x="700" y="960" text-anchor="middle" class="small">Solid arrows: interaction     ·     Dashed arrows: session ownership / persistent state</text>
</svg>
